[package]
name = "hedge-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Self_Healing_Supervisor: Failure_Detector, Recovery_Policy, and Recovery_Actuator (R25)."

# Build script enforces the architectural-forbid contract at compile time
# (defensive in-crate half of the Hot_Path Purity gate; the full transitive
# closure is asserted by the CI workflow from task 8.1). Mirrors the
# pattern used by `crates/hedge-warmcache/build.rs` and
# `crates/hedge-bus/build.rs`.
build = "build.rs"

[lib]
path = "src/lib.rs"

# The supervisor is a *separate process* so a Hot_Path crash never kills it
# (design § Self-Healing Flow; R29.6). The binary is shipped from
# `docker/hot_path/Dockerfile.supervisor` and wired into `docker-compose.yml`
# under the `hedge-supervisor` service.
[[bin]]
name = "hedge-supervisor"
path = "src/main.rs"

[dependencies]
hedge-core    = { path = "../hedge-core" }
hedge-bus     = { path = "../hedge-bus" }
hedge-config  = { path = "../hedge-config" }

tokio              = { workspace = true }
async-nats         = { workspace = true }
redis              = { workspace = true }
bytes              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot        = { workspace = true }
once_cell          = { workspace = true }
futures            = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tempfile = { workspace = true }
