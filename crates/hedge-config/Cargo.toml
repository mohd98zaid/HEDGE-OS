[package]
name = "hedge-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "YAML configuration loader with JSON Schema validation for PROJECT HEDGE."

[lib]
path = "src/lib.rs"

[dependencies]
hedge-core = { path = "../hedge-core" }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
# Disable default features to avoid pulling in `reqwest` (resolve-http) and
# the bundled CLI binary; we only need in-process schema validation. The
# `draft202012` feature gates the `Draft::Draft202012` enum variant in
# jsonschema 0.18.x.
jsonschema = { workspace = true, features = ["draft202012"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
