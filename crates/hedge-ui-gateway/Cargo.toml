[package]
name = "hedge-ui-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Thin NATS-to-WebSocket bridge that powers the React Human_Control_UI. NOT a Hot_Path crate."

[lib]
path = "src/lib.rs"

[[bin]]
name = "hedge-ui-gateway"
path = "src/main.rs"

[dependencies]
hedge-core = { path = "../hedge-core" }
hedge-bus = { path = "../hedge-bus" }
hedge-schemas = { path = "../hedge-schemas" }
hedge-obs = { path = "../hedge-obs" }
hedge-config = { path = "../hedge-config" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
async-nats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
