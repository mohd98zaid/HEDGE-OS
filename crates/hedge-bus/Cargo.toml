[package]
name = "hedge-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed NATS + Redis_Streams transport wrappers for PROJECT HEDGE."

[lib]
path = "src/lib.rs"

# Build script enforces the architectural-forbid contract at compile time.
# The full transitive-closure check ships with task 8.1's CI workflow; the
# `build.rs` below is a defensive in-crate check that fires if a prohibited
# feature flag is ever introduced on this crate.
build = "build.rs"

[dependencies]
hedge-core = { path = "../hedge-core" }
tokio = { workspace = true }
async-nats = { workspace = true }
redis = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
# `serde_json` is required by the `JsonCodec` implementation of the abstract
# `Codec<T>` trait. The workspace already pins it; this is the only deviation
# from the dependency list quoted in the task description.
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
flatbuffers = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
