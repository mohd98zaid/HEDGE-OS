[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hedge-warm-ai"
version = "0.1.0"
description = "PROJECT HEDGE Warm_AI_Pipeline: News, Regime, Priority, Psychology, Ranking, Journal, Governance, Shadow_Mode."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "PROJECT HEDGE" }]
keywords = ["trading", "ai", "ollama", "onnx", "nse", "bse"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Office/Business :: Financial :: Investment",
  "Private :: Do Not Upload",
]

# Pinned runtime dependencies for the Warm_AI_Pipeline microservices.
# Values are deliberately conservative; concrete sub-tasks may bump them.
dependencies = [
  # Messaging + storage
  "nats-py>=2.7,<3.0",
  "redis>=5.0,<6.0",
  "asyncpg>=0.29,<0.31",
  "qdrant-client>=1.10,<2.0",
  # ML / NLP runtime
  "onnxruntime>=1.18,<2.0",
  "transformers>=4.42,<5.0",
  "tokenizers>=0.19,<0.21",
  "scikit-learn>=1.5,<2.0",
  "xgboost>=2.0,<3.0",
  "lightgbm>=4.3,<5.0",
  "numpy>=1.26,<2.2",
  "pandas>=2.2,<3.0",
  # Schemas and config
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.22,<5.0",
  # Observability
  "opentelemetry-api>=1.25,<2.0",
  "opentelemetry-sdk>=1.25,<2.0",
  "opentelemetry-exporter-otlp>=1.25,<2.0",
  "prometheus-client>=0.20,<1.0",
  "structlog>=24.1,<25.0",
  # Ollama HTTP client
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "hypothesis>=6.108,<7.0",
  "hypothesis-jsonschema>=0.23,<1.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
  "types-PyYAML>=6.0,<7.0",
]

# Each Warm_AI_Pipeline microservice is launched as a console script. The
# concrete entry-point modules land in tasks 22.x–32.x; they are listed here
# so docker-compose service commands have stable references.
[project.scripts]
hedge-news        = "hedge_warm_ai.news.service:main"
hedge-regime      = "hedge_warm_ai.regime.service:main"
hedge-priority    = "hedge_warm_ai.priority.service:main"
hedge-prevday     = "hedge_warm_ai.prev_day.service:main"
hedge-psych       = "hedge_warm_ai.psychology.service:main"
hedge-rank        = "hedge_warm_ai.ranking.service:main"
hedge-journal     = "hedge_warm_ai.journal.service:main"
hedge-governance  = "hedge_warm_ai.governance.service:main"
hedge-shadow      = "hedge_warm_ai.shadow.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hedge_warm_ai"]

# Include the canonical JSON schema files as package data so the pydantic
# mirrors can load them via importlib.resources at runtime and at test time.
[tool.hatch.build.targets.wheel.force-include]
"src/hedge_warm_ai/schemas/json_schemas" = "hedge_warm_ai/schemas/json_schemas"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"
