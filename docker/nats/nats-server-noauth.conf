# NATS server config — NO AUTH (local development only)
# Use this for local development with run-local.bat / start.bat.
# Production MUST use nats-server.conf with full ACL.

server_name: hedge-nats-dev
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 1GB
  max_file_store: 10GB
}

max_payload: 4MB
max_connections: 1024
write_deadline: "1s"

# No authentication — all subjects open to all clients.
# This is ONLY for local development. Do NOT deploy this to production.
