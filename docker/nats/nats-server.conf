# =============================================================================
# PROJECT HEDGE — NATS server configuration (production-grade ACL profile).
#
# This config provisions the five accounts mandated by R21.3 / R30.6 and the
# design's "NATS Subject Naming Convention" table (design.md §
# Authority Hierarchy and Decision Flow + Data Models § NATS Subject Naming
# Convention):
#
#   * hot_path      — Hot_Path Rust services (Market_Data, Orderflow,
#                     Features, Signals, Risk, Execution, Position, Replay,
#                     Session manager).
#   * warm_ai       — Warm_AI_Pipeline Python services + Memory_RAG_Layer.
#                     Explicitly DENIED publish on `risk.*`, `exec.*`,
#                     `trader.*` (R21.3, R30.6) — even with valid
#                     credentials, the NATS server rejects publishes on
#                     those subjects.
#   * ui_gateway    — Human_Control_UI WebSocket gateway. Holds the only
#                     publish permission on `trader.intent.*`.
#   * supervisor    — Self_Healing_Supervisor + Session manager actions.
#                     Publishes recovery actions on `ops.action.*`.
#   * obs_collector — Read-only observability collector (Prometheus,
#                     Loki tail, Jaeger). Subscribe-only on `>`.
#
# Two account-mode options exist:
#
#   1. **Operator + JWT mode** (production, this file): the operator JWT
#      and per-account JWTs are produced by `provision-creds.sh` (which
#      runs `nsc`) and resolved by the `MEMORY` resolver. The
#      `resolver_preload` map is populated from `accounts.jwt`, a file
#      generated at provisioning time. This is the form recommended at
#      https://docs.nats.io/running-a-nats-service/configuration/securing_nats/auth_intro/nkey_auth_jwt
#
#   2. **Inline static accounts** (alternative): suitable for ephemeral
#      local validation. The five accounts are declared inline with
#      `users: [{user, nkey, permissions}]`. See
#      `nats-server.conf.static-accounts.example` (not committed) for the
#      full inline form. The operator-JWT path is preferred because it
#      keeps the per-user public NKEYs out of source control entirely.
#
# Hot reload (`nats-server --signal reload`) is supported for the resolver
# preload and the permission lists below; account JWT rotation does NOT
# require a server restart.
#
# Reference: https://docs.nats.io/running-a-nats-service/configuration/securing_nats/auth_intro/nkey_auth_jwt
# =============================================================================

server_name: hedge-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# JetStream backs durable subjects (Replay_Recorder ledger, supervisor
# reconnection state, etc.). Limits scale with the deployment topology
# documented in design.md § Deployment Topology (R29).
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 1GB
  max_file_store:   10GB
}

# Tick + orderbook FlatBuffers payloads stay well under 1MB; cap at 4MB to
# absorb option-chain bursts without splitting messages.
max_payload: 4MB

# Reasonable client connection ceiling for a single-VPS deployment.
max_connections: 1024

# Slow consumer protection — disconnect a consumer that lags more than 1s.
write_deadline: "1s"

# -----------------------------------------------------------------------------
# Operator + JWT auth (production)
# -----------------------------------------------------------------------------
#
# `operator` and `resolver_preload` reference files written by
# `docker/nats/provision-creds.sh`. Until the script has been run on this
# host, the files are absent and the server will refuse to start — this is
# the desired fail-closed behaviour (R21.3, R30.6).
#
# operator: /etc/nats/jwt/hedge_op.jwt
# system_account: <SYSTEM_ACCOUNT_PUBLIC_KEY>
# resolver: MEMORY
# resolver_preload: {
#   <HEDGE_ACCOUNT_PUBKEY>:        "<HEDGE_ACCOUNT_JWT>",
#   <SYSTEM_ACCOUNT_PUBKEY>:       "<SYSTEM_ACCOUNT_JWT>"
# }
#
# `provision-creds.sh` writes a self-contained `accounts.conf` snippet
# (under `docker/nats/generated/accounts.conf`) that fills in the four
# placeholder fields above. To activate operator-mode, uncomment the four
# lines above and substitute the generated values, OR `include` the file:
#
#   include ./generated/accounts.conf
#
# Until then, the inline development profile below is active.

# -----------------------------------------------------------------------------
# Inline static accounts (development profile)
# -----------------------------------------------------------------------------
#
# Each account holds a `users` array that points at the `*.creds` file
# the consumer container will mount. The `users` blocks below declare the
# permissions; the actual user nkeys come from the `.creds` files
# referenced by the consumer at connect time. For the dev profile NATS
# accepts a single password-style user per account so an operator can
# bring the broker up immediately for local smoke testing without running
# `nsc`.
#
# Production deployments MUST use the operator + JWT mode above.
# -----------------------------------------------------------------------------

accounts: {

  # --- hot_path -------------------------------------------------------------
  # Full Hot_Path domain authority. Publishes every Hot_Path event domain
  # and consumes every input it requires (including Warm_AI scores from
  # `ai.*`, prev-day memory from `mem.*`, and trader intents from
  # `trader.*` for the Risk_Engine's intent-aggregation step).
  hot_path: {
    users: [
      { user: "hot_path",
        password: "$HEDGE_HOT_PATH_PASSWORD",
        permissions: {
          publish: {
            allow: [
              "md.>",
              "of.>",
              "feat.>",
              "sig.>",
              "risk.>",
              "exec.>",
              "pos.>",
              "obs.>",
              "ops.>"
            ]
          }
          subscribe: {
            allow: [
              "md.>",
              "of.>",
              "feat.>",
              "sig.>",
              "risk.>",
              "exec.>",
              "pos.>",
              "obs.>",
              "ops.>",
              "ai.>",
              "mem.>",
              "trader.>"
            ]
          }
        }
      }
    ]
  }

  # --- warm_ai --------------------------------------------------------------
  # Warm_AI_Pipeline + Memory_RAG_Layer. Constrained-subject publish surface
  # (R21.3, R30.6): the allow-list contains ONLY `ai.>`, `mem.>`, and
  # `obs.>` (warm components emit observability events too). The deny-list
  # is redundant given the allow-list-only model but is included as a
  # belt-and-braces audit signal — any future broadening of the allow list
  # will still trip the explicit deny on the three forbidden domains.
  warm_ai: {
    users: [
      { user: "warm_ai",
        password: "$HEDGE_WARM_AI_PASSWORD",
        permissions: {
          publish: {
            allow: [
              "ai.>",
              "mem.>",
              "obs.>"
            ]
            deny: [
              "risk.>",
              "exec.>",
              "trader.>"
            ]
          }
          subscribe: {
            allow: [
              "md.>",
              "sig.>",
              "exec.>",
              "pos.>",
              "mem.>",
              "ops.>",
              "ai.>"
            ]
          }
        }
      }
    ]
  }

  # --- ui_gateway -----------------------------------------------------------
  # The UI gateway is the SOLE publisher on `trader.intent.*` (R21.1).
  # It also publishes `obs.*` for its own telemetry. It subscribes to the
  # full curated UI subject set (md, of, feat, sig, risk, exec, pos, ai,
  # mem, ops, obs) so it can fan out to per-channel WebSocket
  # subscriptions documented in design.md § WebSocket Channels.
  ui_gateway: {
    users: [
      { user: "ui_gateway",
        password: "$HEDGE_UI_GATEWAY_PASSWORD",
        permissions: {
          publish: {
            allow: [
              "trader.>",
              "obs.>"
            ]
          }
          subscribe: {
            allow: [
              "md.>",
              "of.>",
              "feat.>",
              "sig.>",
              "risk.>",
              "exec.>",
              "pos.>",
              "ai.>",
              "mem.>",
              "ops.>",
              "obs.>"
            ]
          }
        }
      }
    ]
  }

  # --- supervisor -----------------------------------------------------------
  # Self_Healing_Supervisor (design.md § Self-Healing Flow). Publishes
  # recovery actions on `ops.action.*` and observability events on `obs.*`.
  # Subscribes to the failure-detection event surface only (R25.1–R25.5),
  # NOT the full Hot_Path firehose — the supervisor must remain
  # low-bandwidth so its own crash blast radius is small.
  supervisor: {
    users: [
      { user: "supervisor",
        password: "$HEDGE_SUPERVISOR_PASSWORD",
        permissions: {
          publish: {
            allow: [
              "ops.action.>",
              "obs.>"
            ]
          }
          subscribe: {
            allow: [
              "obs.>",
              "md.connection.>",
              "cache.redis.>",
              "broker.metric.>",
              "obs.latency.>",
              "obs.budget.breach.>",
              "obs.error.>",
              "ai.ollama.degraded",
              "exec.broker.failover"
            ]
          }
        }
      }
    ]
  }

  # --- obs_collector --------------------------------------------------------
  # Read-only observability collector (Prometheus exporter, Loki shipper,
  # Jaeger collector ingest). NO publish permission. Subscribes to `>`
  # because the collector must see every domain to produce metrics, logs,
  # and traces.
  obs_collector: {
    users: [
      { user: "obs_collector",
        password: "$HEDGE_OBS_COLLECTOR_PASSWORD",
        permissions: {
          publish: {
            deny: [">"]
          }
          subscribe: {
            allow: [">"]
          }
        }
      }
    ]
  }

  # --- SYS (NATS internal system account) -----------------------------------
  # Required when `accounts {…}` is declared. Used internally for `$SYS.>`
  # events and runtime reconfiguration. Not exposed to any tenant account.
  SYS: {
    users: [
      { user: "sys",
        password: "$HEDGE_SYS_PASSWORD"
      }
    ]
  }
}

# Designate which of the accounts above is the system account.
system_account: SYS

# Environment-variable substitution: `$VAR` references are resolved against
# the server's environment at startup. The compose file injects each
# password via the `env_file` mechanism so they never appear in source. For
# operator + JWT mode the password fields are removed entirely.
